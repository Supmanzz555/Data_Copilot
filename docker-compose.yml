version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: deep_insights
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d deep_insights"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  pg_data:
